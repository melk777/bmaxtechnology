<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2300" viewBox="0 0 1800 2300">
  <defs>
    <style>
      .bg{fill:#f2f4f3}.card{fill:#ffffff;stroke:#d8e2e7;stroke-width:2}.dark{fill:#071624}.ink{fill:#071624}.cyan{fill:#55d6ff}.blue{fill:#0d8ac5}.red{fill:#e1262e}.muted{fill:#5c7583}.number{font:700 24px Arial,sans-serif;letter-spacing:2px}.name{font:800 56px Arial,sans-serif;letter-spacing:1px}.sub{font:700 19px Arial,sans-serif;letter-spacing:4px}.label{font:700 19px Arial,sans-serif;letter-spacing:2px}.title{font:800 58px Arial,sans-serif;letter-spacing:-2px}.desc{font:400 23px Arial,sans-serif}.line{stroke:#55d6ff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;fill:none}.lineb{stroke:#0d8ac5;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#b8cbd6;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1800" height="2300"/>
  <rect class="dark" x="70" y="60" width="1660" height="230" rx="28"/>
  <text x="130" y="155" fill="#ffffff" class="title">BMAX TECHNOLOGY</text>
  <text x="130" y="212" fill="#55d6ff" class="sub">ESTUDOS DE IDENTIDADE VISUAL • 10 DIREÇÕES</text>
  <text x="130" y="257" fill="#c4d7e0" class="desc">Paleta do site: azul-marinho, azul elétrico, ciano, branco-gelo e vermelho de destaque.</text>

  <!-- 01 -->
  <g transform="translate(70 340)"><rect class="card" width="790" height="330" rx="24"/><text class="number muted" x="38" y="55">01</text><text class="label muted" x="94" y="55">X DE ENERGIA</text><g transform="translate(48 94)"><path class="lineb" d="M55 18L98 18L77 61L118 61L55 143L76 92L38 92Z"/><text class="name ink" x="155" y="83">BMA<tspan class="blue">X</tspan></text><text class="sub muted" x="159" y="119">TECHNOLOGY</text></g><text class="desc muted" x="48" y="274">O “X” vira um raio discreto: direto, técnico e memorável.</text></g>
  <!-- 02 -->
  <g transform="translate(940 340)"><rect class="dark" width="790" height="330" rx="24"/><text class="number" fill="#9eb4bf" x="38" y="55">02</text><text class="label" fill="#9eb4bf" x="94" y="55">B CONECTADO</text><g transform="translate(48 82) scale(.85)"><path fill="#55d6ff" d="M12 0h76c44 0 70 21 70 55 0 21-10 37-28 45 24 7 38 27 38 53 0 39-30 62-78 62H12zm45 34v48h28c17 0 28-9 28-24s-11-24-28-24zm0 81v50h35c19 0 31-10 31-25s-12-25-31-25z"/><path class="line" d="M89 42l-15 47h28l-26 61"/><text class="name" fill="#ffffff" x="205" y="83">BMAX</text><text class="sub" fill="#55d6ff" x="209" y="119">TECHNOLOGY</text></g><text class="desc" fill="#c4d7e0" x="48" y="274">O monograma B traz energia e funciona muito bem em ícones.</text></g>
  <!-- 03 -->
  <g transform="translate(70 710)"><rect class="dark" width="790" height="330" rx="24"/><text class="number" fill="#9eb4bf" x="38" y="55">03</text><text class="label" fill="#9eb4bf" x="94" y="55">ÓRBITA ELÉTRICA</text><g transform="translate(48 90)"><circle cx="75" cy="76" r="61" class="thin" stroke="#55d6ff"/><path class="line" d="M30 78h33l-12 25h37L61 145l8-42h-30z"/><circle cx="132" cy="32" r="8" class="red"/><text class="name" fill="#ffffff" x="180" y="83">BMAX</text><text class="sub" fill="#55d6ff" x="184" y="119">TECHNOLOGY</text></g><text class="desc" fill="#c4d7e0" x="48" y="274">Uma órbita representa conexão, movimento e ecossistema.</text></g>
  <!-- 04 -->
  <g transform="translate(940 710)"><rect class="card" width="790" height="330" rx="24"/><text class="number muted" x="38" y="55">04</text><text class="label muted" x="94" y="55">CIRCUITO B</text><g transform="translate(48 91)"><path class="lineb" d="M80 16H39v119h43c44 0 68-22 68-59S124 16 80 16Z"/><circle class="cyan" cx="79" cy="76" r="18"/><path class="lineb" d="M97 76h39"/><text class="name ink" x="180" y="83">BMAX</text><text class="sub muted" x="184" y="119">TECHNOLOGY</text></g><text class="desc muted" x="48" y="274">Identidade corporativa com referência a circuitos e carregamento.</text></g>
  <!-- 05 -->
  <g transform="translate(70 1080)"><rect class="card" width="790" height="330" rx="24"/><text class="number muted" x="38" y="55">05</text><text class="label muted" x="94" y="55">REDE DE CARGA</text><g transform="translate(48 92)"><path class="lineb" d="M20 112L75 22l55 90z"/><circle class="blue" cx="75" cy="22" r="15"/><circle class="cyan" cx="20" cy="112" r="15"/><circle class="red" cx="130" cy="112" r="15"/><text class="name ink" x="180" y="83">BMAX</text><text class="sub muted" x="184" y="119">TECHNOLOGY</text></g><text class="desc muted" x="48" y="274">Nós conectados: ideal para infraestrutura, rede e expansão.</text></g>
  <!-- 06 -->
  <g transform="translate(940 1080)"><rect class="dark" width="790" height="330" rx="24"/><text class="number" fill="#9eb4bf" x="38" y="55">06</text><text class="label" fill="#9eb4bf" x="94" y="55">ROTA DE ENERGIA</text><g transform="translate(48 92)"><path class="line" d="M17 122C68 112 38 43 85 32c44-10 31 68 83 39"/><path class="line" d="M130 21l37 50-54 2z"/><text class="name" fill="#ffffff" x="206" y="83">BMAX</text><text class="sub" fill="#55d6ff" x="210" y="119">TECHNOLOGY</text></g><text class="desc" fill="#c4d7e0" x="48" y="274">Linha de energia em movimento: mobilidade, percurso e progresso.</text></g>
  <!-- 07 -->
  <g transform="translate(70 1450)"><rect class="dark" width="790" height="330" rx="24"/><text class="number" fill="#9eb4bf" x="38" y="55">07</text><text class="label" fill="#9eb4bf" x="94" y="55">SELO DE POTÊNCIA</text><g transform="translate(48 88)"><path fill="none" stroke="#55d6ff" stroke-width="9" d="M77 8l64 37v72l-64 37-64-37V45z"/><path fill="#55d6ff" d="M84 37L49 92h27l-11 34 42-59H79z"/><text class="name" fill="#ffffff" x="183" y="83">BMAX</text><text class="sub" fill="#55d6ff" x="187" y="119">TECHNOLOGY</text></g><text class="desc" fill="#c4d7e0" x="48" y="274">Selo robusto para eletropostos, alta potência e uniformes.</text></g>
  <!-- 08 -->
  <g transform="translate(940 1450)"><rect class="card" width="790" height="330" rx="24"/><text class="number muted" x="38" y="55">08</text><text class="label muted" x="94" y="55">PULSO DE CARGA</text><g transform="translate(48 88)"><path class="lineb" d="M10 80h32l15-50 28 104 19-54h55"/><circle class="cyan" cx="159" cy="80" r="12"/><text class="name ink" x="205" y="83">BMAX</text><text class="sub muted" x="209" y="119">TECHNOLOGY</text></g><text class="desc muted" x="48" y="274">Um pulso energético com presença tecnológica e humana.</text></g>
  <!-- 09 -->
  <g transform="translate(70 1820)"><rect class="card" width="790" height="330" rx="24"/><text class="number muted" x="38" y="55">09</text><text class="label muted" x="94" y="55">ESCUDO CONECTADO</text><g transform="translate(48 88)"><path fill="#071624" d="M78 6l61 25v48c0 38-26 64-61 79-35-15-61-41-61-79V31z"/><path fill="#55d6ff" d="M84 39L53 87h24l-8 30 36-50H82z"/><text class="name ink" x="182" y="83">BMAX</text><text class="sub muted" x="186" y="119">TECHNOLOGY</text></g><text class="desc muted" x="48" y="274">Segurança, instalação profissional e confiança para negócios.</text></g>
  <!-- 10 -->
  <g transform="translate(940 1820)"><rect class="dark" width="790" height="330" rx="24"/><text class="number" fill="#9eb4bf" x="38" y="55">10</text><text class="label" fill="#9eb4bf" x="94" y="55">WORDMARK PREMIUM</text><g transform="translate(48 92)"><text class="name" fill="#ffffff" x="0" y="83">BMA</text><path fill="#55d6ff" d="M166 38h26l17 22 17-22h26l-30 38 31 43h-27l-18-27-19 27h-27l32-43z"/><rect class="red" x="0" y="105" width="255" height="7" rx="3"/><text class="sub" fill="#55d6ff" x="2" y="149">TECHNOLOGY</text></g><text class="desc" fill="#c4d7e0" x="48" y="274">A opção mais elegante: marca tipográfica proprietária e versátil.</text></g>
  <text class="label muted" x="70" y="2245">BMAX • ESTUDOS CONCEITUAIS — APLICAÇÃO FINAL EM VETOR SERÁ DESENVOLVIDA APÓS A ESCOLHA.</text>
